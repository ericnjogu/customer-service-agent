{{- if .Values.exporters.otlp.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-grafana-datasource
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-gateway.{{ .Release.Namespace }}.svc
        isDefault: false
        editable: false
{{- end }}
