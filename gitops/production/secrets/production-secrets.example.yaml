apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
  name: customer-service-production
  namespace: customer-service-production
  annotations:
    argocd.argoproj.io/sync-wave: "15"
spec:
  suspend: false
  secretTemplates:
    - name: api-keys
      stringData:
        OPENAI_API_KEY: replace-me
        LANGSMITH_API_KEY: replace-me
        LANGSMITH_WORKSPACE_ID: replace-me
        RESEND_API_KEY: replace-me
        PLATFORM_TAVILY_API_KEY: replace-me
        OPENAI_ADMIN_KEY: replace-me
    - name: app-configs
      stringData:
        AGENT_EMAIL_FROM: replace-me
        AGENT_ONBOARDING_REVIEW_EMAIL: replace-me
        AGENT_ONBOARDING_VERIFICATION_CODE_SECRET: replace-with-at-least-32-random-characters
    - name: backup-credentials
      stringData:
        ACCESS_KEY_ID: replace-with-fil-one-access-key
        ACCESS_SECRET_KEY: replace-with-fil-one-secret-key
    - name: ghcr-pull
      type: kubernetes.io/dockerconfigjson
      stringData:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"replace-me","password":"replace-with-read-packages-token","auth":"replace-with-base64-user-colon-token"}}}'
---
apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
  name: cloudflare-dns
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  suspend: false
  secretTemplates:
    - name: cloudflare-api-token
      stringData:
        api-token: replace-me
