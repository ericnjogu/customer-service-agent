apiVersion: v1
kind: Service
metadata:
  name: {{ include "customer-support.fullname" . }}-app
  labels:
    {{- include "customer-support.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: app
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  type: {{ .Values.service.type }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "customer-support.fullname" . }}-app
  labels:
    {{- include "customer-support.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: app
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              until pg_isready
              --host={{ include "customer-support.fullname" . }}-postgres
              --port=5432
              --username={{ .Values.postgres.username }}
              --dbname={{ .Values.postgres.database }};
              do echo "Waiting for PostgreSQL"; sleep 2; done
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: SUPPORT_RETRIEVAL_PROVIDER
              value: {{ .Values.retrieval.provider | quote }}
            - name: SUPPORT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "customer-support.fullname" . }}-postgres
                  key: database-url
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
