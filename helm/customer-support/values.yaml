image:
  repository: customer-support
  tag: local
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8000

tenant:
  defaultId: default
  plans:
    sme:
      description: Shared small-business onboarding baseline
      defaultFeatures:
        - telegram
        - whatsapp
      vectorIndexMode: shared
      hostingModel: shared
    enterprise:
      description: Enterprise onboarding baseline
      defaultFeatures:
        - telegram
        - whatsapp
        - multimedia
      vectorIndexMode: dedicated
      hostingModel: dedicated

postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  port: 5432
  database: support
  username: support
  password: local-only-password
  storage: 1Gi

redis:
  enabled: true
  image: redis:7-alpine
  port: 6379
  url: ""

retrieval:
  provider: pgvector

vector:
  collection: customer-support

answer:
  provider: openai

embedding:
  provider: openai
  model: text-embedding-3-small
  dimensions: 1536

questionPlanner:
  provider: llm

humanRequestDetector:
  provider: llm

conversationHistory:
  maxMessages: 100
  greetingLapseMinutes: 60

tenantConfigCache:
  provider: redis
  ttlSeconds: 300

telegram:
  existingSecret: "telegram-bot"
  credentialProvider: kubernetes
  secretNamespace: ""
  botTokenSecretKey: TELEGRAM_BOT_TOKEN
  webhookSecretTokenSecretKey: TELEGRAM_WEBHOOK_SECRET_TOKEN

whatsapp:
  existingSecret: whatsapp-cloud
  accessTokenSecretKey: WHATSAPP_ACCESS_TOKEN
  phoneNumberIdSecretKey: WHATSAPP_PHONE_NUMBER_ID
  verifyTokenSecretKey: WHATSAPP_VERIFY_TOKEN
  graphApiVersion: v20.0

llm:
  model: gpt-4.1-mini
  temperature: "0"
  existingSecret: "api-keys"
  secretKey: OPENAI_API_KEY

logging:
  level: INFO
  format: "{asctime} - {levelname}: {name}: {message}"

langsmith:
  LANGSMITH_TRACING: "true"
  LANGSMITH_TRACING_V2: "true"
  LANGCHAIN_TRACING_V2: "true"
  LANGSMITH_ENDPOINT: "https://eu.api.smith.langchain.com"
  LANGSMITH_PROJECT: "customer-service-dev2"
  LANGSMITH_WORKSPACE_ID: ""
  existingSecret: "api-keys"
  secretKey: LANGSMITH_API_KEY

resources: {}
