apiVersion: v1
kind: Namespace
metadata:
  name: customer-service-staging
  labels:
    app.kubernetes.io/part-of: aws-csa
    environment: staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-csa-operator
  namespace: customer-service-staging
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-csa-operator
  namespace: customer-service-staging
subjects:
  - kind: Group
    name: ristoh-ai-chatbot-operator
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aws-csa-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-csa-staging-deployer
  namespace: customer-service-staging
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-csa-staging-deployer
  namespace: customer-service-staging
subjects:
  - kind: Group
    name: ristoh-ai-chatbot-staging-deployer
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aws-csa-staging-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-csa-customer-service-secret-writer
  namespace: customer-service-staging
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-csa-customer-service-secret-writer
  namespace: customer-service-staging
subjects:
  - kind: ServiceAccount
    name: aws-csa-customer-service-app
    namespace: customer-service-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aws-csa-customer-service-secret-writer
---
apiVersion: vpcresources.k8s.aws/v1beta1
kind: SecurityGroupPolicy
metadata:
  name: aws-csa-data-access
  namespace: customer-service-staging
spec:
  podSelector:
    matchLabels:
      aws-csa/data-access: "true"
  securityGroups:
    groupIds:
      - {{ required "workloadSecurityGroupId is required" .Values.workloadSecurityGroupId }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: customer-service-staging
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-keys
  namespace: customer-service-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: api-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: ristoh-ai-chatbot/staging/api-keys
        property: OPENAI_API_KEY
    - secretKey: LANGSMITH_API_KEY
      remoteRef:
        key: ristoh-ai-chatbot/staging/api-keys
        property: LANGSMITH_API_KEY
    - secretKey: LANGSMITH_WORKSPACE_ID
      remoteRef:
        key: ristoh-ai-chatbot/staging/api-keys
        property: LANGSMITH_WORKSPACE_ID
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: ristoh-ai-chatbot/staging/api-keys
        property: RESEND_API_KEY
    - secretKey: PLATFORM_TAVILY_API_KEY
      remoteRef:
        key: ristoh-ai-chatbot/staging/api-keys
        property: PLATFORM_TAVILY_API_KEY
    - secretKey: OPENAI_ADMIN_KEY
      remoteRef:
        key: ristoh-ai-chatbot/staging/api-keys
        property: OPENAI_ADMIN_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-configs
  namespace: customer-service-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: app-configs
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AGENT_EMAIL_FROM
      remoteRef:
        key: ristoh-ai-chatbot/staging/app-configs
        property: AGENT_EMAIL_FROM
    - secretKey: AGENT_ONBOARDING_REVIEW_EMAIL
      remoteRef:
        key: ristoh-ai-chatbot/staging/app-configs
        property: AGENT_ONBOARDING_REVIEW_EMAIL
    - secretKey: AGENT_WEBHOOK_PUBLIC_BASE_URL
      remoteRef:
        key: ristoh-ai-chatbot/staging/app-configs
        property: AGENT_WEBHOOK_PUBLIC_BASE_URL
