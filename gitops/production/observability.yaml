apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-metrics
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts
    chart: victoria-metrics-k8s-stack
    targetRevision: 0.92.1
    helm:
      releaseName: vm
      valuesObject:
        vmsingle:
          spec:
            retentionPeriod: 7d
            storage:
              resources: { requests: { storage: 10Gi } }
        grafana:
          persistence: { enabled: true, size: 2Gi }
        alertmanager:
          enabled: true
          spec:
            configSecret: operations-alert-email
  destination: { server: https://kubernetes.default.svc, namespace: monitoring }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true,ServerSideApply=true]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.3.0
    helm:
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig: { replication_factor: 1 }
          storage: { type: filesystem }
          limits_config: { retention_period: 168h }
          schemaConfig:
            configs:
              - from: "2026-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index: { prefix: loki_index_, period: 24h }
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
          rulerConfig:
            storage:
              type: local
              local: { directory: /etc/loki/rules }
            rule_path: /var/loki/rules-tmp
            alertmanager_url: http://vmalertmanager-vm-victoria-metrics-k8s-stack.monitoring.svc:9093
            enable_alertmanager_v2: true
        singleBinary:
          replicas: 1
          persistence: { size: 10Gi }
          extraVolumes:
            - name: openbao-alert-rules
              configMap:
                name: openbao-audit-alerts
                items: [{ key: openbao.yaml, path: fake/openbao.yaml }]
          extraVolumeMounts:
            - { name: openbao-alert-rules, mountPath: /etc/loki/rules, readOnly: true }
        chunksCache: { enabled: false }
        resultsCache: { enabled: false }
        backend: { replicas: 0 }
        read: { replicas: 0 }
        write: { replicas: 0 }
  destination: { server: https://kubernetes.default.svc, namespace: monitoring }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
