{{- if .Values.backup.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-wal-archive
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: postgres-wal-archive }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres-wal-archive }
    spec:
      securityContext: { fsGroup: 999 }
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      initContainers:
        - name: restore-wal-buffer
          image: {{ printf "%s@%s" .Values.backup.image.repository .Values.backup.image.digest | quote }}
          command: [bash, -ceu]
          args:
            - |
              cd /wal
              borg list ::latest >/dev/null 2>&1 && borg extract ::latest || true
          env: &borgEnv
            - { name: BORG_REPO, value: "ssh://{{ .Values.backup.storageBoxUser }}@{{ .Values.backup.storageBoxHost }}:23/./ristoh-production/postgres-wal" }
            - { name: BORG_RSH, value: "ssh -i /secrets/id_ed25519 -o BatchMode=yes -o UserKnownHostsFile=/secrets/known_hosts" }
            - name: BORG_PASSPHRASE
              valueFrom: { secretKeyRef: { name: {{ .Values.backup.secretName }}, key: borg-passphrase } }
          volumeMounts: &backupMounts
            - { name: wal, mountPath: /wal }
            - { name: backup-credentials, mountPath: /secrets, readOnly: true }
      containers:
        - name: receive-wal
          image: {{ printf "%s@%s" .Values.backup.image.repository .Values.backup.image.digest | quote }}
          command: [bash, -ceu]
          args:
            - exec pg_receivewal --dbname="host=production-postgres-rw port=5432 user=postgres sslmode=require" --directory=/wal --verbose
          env:
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: production-postgres-superuser, key: password } }
          volumeMounts:
            - { name: wal, mountPath: /wal }
          resources: {{- toYaml .Values.backup.resources | nindent 12 }}
        - name: upload-wal
          image: {{ printf "%s@%s" .Values.backup.image.repository .Values.backup.image.digest | quote }}
          command: [bash, -ceu]
          args:
            - |
              while true; do
                borg create --compression zstd,3 "::{now:%Y-%m-%dT%H-%M-%SZ}" /wal
                borg prune --keep-within 35d
                sleep {{ .Values.backup.walIntervalSeconds }}
              done
          env: *borgEnv
          volumeMounts: *backupMounts
          resources: {{- toYaml .Values.backup.resources | nindent 12 }}
      volumes:
        - name: wal
          emptyDir: { sizeLimit: {{ .Values.backup.walBufferStorage }} }
        - name: backup-credentials
          secret:
            secretName: {{ .Values.backup.secretName }}
            defaultMode: 0440
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-force-wal-switch
  namespace: {{ .Values.namespace }}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            {{- toYaml .Values.imagePullSecrets | nindent 12 }}
          containers:
            - name: switch
              image: {{ printf "%s@%s" .Values.backup.image.repository .Values.backup.image.digest | quote }}
              command: [psql]
              args: ["--host=production-postgres-rw", "--username=postgres", "--dbname=postgres", "--command=SELECT pg_switch_wal()"]
              env:
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: production-postgres-superuser, key: password } }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-base-backup
  namespace: {{ .Values.namespace }}
spec:
  schedule: "31 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          securityContext: { fsGroup: 999 }
          imagePullSecrets:
            {{- toYaml .Values.imagePullSecrets | nindent 12 }}
          containers:
            - name: backup
              image: {{ printf "%s@%s" .Values.backup.image.repository .Values.backup.image.digest | quote }}
              command: [bash, -ceu]
              args:
                - |
                  pg_basebackup --dbname="host=production-postgres-ro port=5432 user=postgres sslmode=require" --pgdata=/work/base --format=tar --gzip --wal-method=stream --checkpoint=fast --progress
                  borg create --stats --compression zstd,3 "::{now:%Y-%m-%dT%H-%M-%SZ}" /work/base
                  borg prune --keep-daily 7 --keep-weekly 4 --keep-monthly 6
                  borg compact
              env:
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: production-postgres-superuser, key: password } }
                - { name: BORG_REPO, value: "ssh://{{ .Values.backup.storageBoxUser }}@{{ .Values.backup.storageBoxHost }}:23/./ristoh-production/postgres-base" }
                - { name: BORG_RSH, value: "ssh -i /secrets/id_ed25519 -o BatchMode=yes -o UserKnownHostsFile=/secrets/known_hosts" }
                - name: BORG_PASSPHRASE
                  valueFrom: { secretKeyRef: { name: {{ .Values.backup.secretName }}, key: borg-passphrase } }
              volumeMounts:
                - { name: work, mountPath: /work }
                - { name: backup-credentials, mountPath: /secrets, readOnly: true }
              resources: {{- toYaml .Values.backup.resources | nindent 16 }}
          volumes:
            - { name: work, emptyDir: { sizeLimit: 45Gi } }
            - name: backup-credentials
              secret: { secretName: {{ .Values.backup.secretName }}, defaultMode: 0440 }
---
apiVersion: v1
kind: Service
metadata:
  name: backup-metrics
  namespace: {{ .Values.namespace }}
  labels: { app.kubernetes.io/name: backup-metrics }
spec:
  selector: { app.kubernetes.io/name: backup-metrics }
  ports: [{ name: metrics, port: 9101, targetPort: metrics }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-metrics
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: backup-metrics }
  template:
    metadata:
      labels: { app.kubernetes.io/name: backup-metrics }
    spec:
      securityContext: { fsGroup: 999 }
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: metrics
          image: {{ printf "%s@%s" .Values.backup.image.repository .Values.backup.image.digest | quote }}
          command: [/usr/local/bin/backup-metrics]
          ports: [{ name: metrics, containerPort: 9101 }]
          env:
            - { name: STORAGE_BOX_HOST, value: {{ .Values.backup.storageBoxHost | quote }} }
            - { name: STORAGE_BOX_USER, value: {{ .Values.backup.storageBoxUser | quote }} }
            - { name: BASE_REPOSITORY, value: "ssh://{{ .Values.backup.storageBoxUser }}@{{ .Values.backup.storageBoxHost }}:23/./ristoh-production/postgres-base" }
            - { name: WAL_REPOSITORY, value: "ssh://{{ .Values.backup.storageBoxUser }}@{{ .Values.backup.storageBoxHost }}:23/./ristoh-production/postgres-wal" }
            - { name: BORG_RSH, value: "ssh -p 23 -i /secrets/id_ed25519 -o BatchMode=yes -o UserKnownHostsFile=/secrets/known_hosts" }
            - name: BORG_PASSPHRASE
              valueFrom: { secretKeyRef: { name: {{ .Values.backup.secretName }}, key: borg-passphrase } }
          volumeMounts:
            - { name: backup-credentials, mountPath: /secrets, readOnly: true }
          resources: {{- toYaml .Values.backup.resources | nindent 12 }}
      volumes:
        - name: backup-credentials
          secret: { secretName: {{ .Values.backup.secretName }}, defaultMode: 0440 }
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: backup-metrics
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [{{ .Values.namespace }}]
  selector:
    matchLabels: { app.kubernetes.io/name: backup-metrics }
  endpoints:
    - { port: metrics, path: /metrics, interval: 5m }
{{- end }}
