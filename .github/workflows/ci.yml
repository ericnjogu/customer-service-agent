name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TOFU_VERSION: 1.12.6

jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: issue_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d issue_tests"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AGENT_ISSUE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/issue_tests
      AGENT_WHATSAPP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/issue_tests
      AGENT_OPENBAO_TEST_URL: http://127.0.0.1:58200
      AGENT_OPENBAO_TEST_ROOT_TOKEN: local-test-only
      AGENT_OPENBAO_RAFT_TESTS: "true"
      AGENT_E2E_CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6
        with: { enable-cache: true }
      - run: uv sync --locked
      - name: Start disposable OpenBao for credential policy tests
        run: |
          docker run -d --name openbao-test -p 127.0.0.1:58200:8200 \
            -e BAO_DEV_ROOT_TOKEN_ID=local-test-only \
            -e BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            openbao/openbao:2.7.1 server -dev
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:58200/v1/sys/health >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: uv run ruff check app tests
      - run: uv run ruff check scripts/bootstrap-local-openbao.py
      - run: bash -n scripts/deploy-local.sh
      - name: Run unit and application tests
        run: uv run pytest -q

  onboarding-browser-qa:
    uses: ./.github/workflows/onboarding-browser-qa.yml

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with: { version: v3.18.6 }
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with: { tofu_version: "${{ env.TOFU_VERSION }}" }
      - name: Validate Helm releases
        run: |
          helm lint helm/production-platform
          helm repo add customer-service-openbao https://openbao.github.io/openbao-helm
          helm dependency build helm/openbao-platform
          helm lint helm/openbao-platform
          helm lint helm/openbao-platform -f helm/openbao-platform/values-local.yaml
          helm template openbao-local helm/openbao-platform -n openbao-local \
            -f helm/openbao-platform/values-local.yaml > /tmp/openbao-local.yaml
          helm template openbao helm/openbao-platform -n openbao \
            --set backups.enabled=true --set backups.endpoint=s3.example.invalid > /tmp/openbao.yaml
          helm lint helm/customer-service --values helm/customer-service/values-production.yaml \
            --set prompts.useBundledFiles=false \
            --set-file prompts.system=app/prompt_templates/system.md \
            --set-file prompts.issueProcessing=app/prompt_templates/issue-processing.md \
            --set-file prompts.questionPlanning=app/prompt_templates/question-planning.md \
            --set-file prompts.websiteAnalysis=app/prompt_templates/website-analysis.md \
            --set-file prompts.websiteResearch=app/prompt_templates/website-research.md
          helm template production-platform helm/production-platform > /tmp/platform.yaml
          helm template one-css helm/customer-service -n customer-service-production \
            -f helm/customer-service/values-production.yaml \
            --set prompts.useBundledFiles=false \
            --set-file prompts.system=app/prompt_templates/system.md \
            --set-file prompts.issueProcessing=app/prompt_templates/issue-processing.md \
            --set-file prompts.questionPlanning=app/prompt_templates/question-planning.md \
            --set-file prompts.websiteAnalysis=app/prompt_templates/website-analysis.md \
            --set-file prompts.websiteResearch=app/prompt_templates/website-research.md > /tmp/app.yaml
          grep -q 'instances: 3' /tmp/platform.yaml
          grep -q 'storageClass: local-path' /tmp/platform.yaml
          grep -q 'ghcr.io/ericnjogu/customer-service-agent@sha256:' /tmp/app.yaml
          grep -q 'secretName: css-ristoh-co-ke-tls' /tmp/app.yaml
      - name: Validate OpenTofu
        run: |
          tofu fmt -check -recursive infra/production
          tofu -chdir=infra/production init -reconfigure -backend-config=path=/tmp/production-ci.tfstate
          tofu -chdir=infra/production validate
          tofu -chdir=infra/production plan -refresh=false -lock=false -input=false \
            -var cloudflare_api_token=0000000000000000000000000000000000000000 \
            -var cloudflare_zone_id=00000000000000000000000000000000 \
            -var 'origin_ipv4_addresses=["192.0.2.11","192.0.2.12","192.0.2.13"]'
      - name: Syntax-check Ansible
        run: |
          python -m pip install ansible-core==2.19.1
          cp ansible/inventory/production.example.yml /tmp/production.yml
          ansible-playbook -i /tmp/production.yml ansible/site.yml --syntax-check
