apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/ericnjogu/customer-service-agent.git
    targetRevision: deploy/production
    path: helm/production-platform
  destination: { server: https://kubernetes.default.svc, namespace: customer-service-production }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
