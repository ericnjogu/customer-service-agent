name: Build and deliver staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  AWS_ACCOUNT_ID: "371664303664"
  ECR_REGISTRY: 371664303664.dkr.ecr.eu-central-1.amazonaws.com

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      app-digest: ${{ steps.digests.outputs.app }}
      web-digest: ${{ steps.digests.outputs.web }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: arn:aws:iam::371664303664:role/ristoh-ai-chatbot-github-ecr-push
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build immutable images for linux/amd64
        run: |
          for repository in customer-service customer-service-web; do
            if aws ecr describe-images --repository-name "$repository" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
              echo "$repository:$GITHUB_SHA already exists; retaining the immutable image"
              continue
            fi
            context="."
            dockerfile="Dockerfile"
            if [ "$repository" = customer-service-web ]; then
              context="web"
              dockerfile="web/Dockerfile"
            fi
            docker buildx build --platform linux/amd64 \
              --file "$dockerfile" \
              --tag "$ECR_REGISTRY/$repository:$GITHUB_SHA" \
              --push "$context"
          done
      - name: Resolve ECR digests
        id: digests
        run: |
          app_digest=$(aws ecr describe-images --repository-name customer-service --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
          web_digest=$(aws ecr describe-images --repository-name customer-service-web --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
          echo "app=$app_digest" >> "$GITHUB_OUTPUT"
          echo "web=$web_digest" >> "$GITHUB_OUTPUT"
          printf 'customer-service=%s\ncustomer-service-web=%s\n' "$app_digest" "$web_digest" | tee staging-image-digests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-image-digests-${{ github.sha }}
          path: staging-image-digests.txt

  deploy:
    needs: build-and-publish
    runs-on: codebuild-ristoh-ai-chatbot-staging-deploy-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      HELM_DRIVER: configmap
      APP_DIGEST: ${{ needs.build-and-publish.outputs.app-digest }}
      WEB_DIGEST: ${{ needs.build-and-publish.outputs.web-digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.18.6
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.36.0
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: arn:aws:iam::371664303664:role/ristoh-ai-chatbot-github-staging-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Configure private EKS access
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name ristoh-ai-chatbot --alias ristoh-ai-chatbot-staging-deploy
      - name: Deploy immutable images with Helm
        run: |
          helm upgrade --install aws-csa helm/customer-service \
            --namespace customer-service-staging \
            --values helm/customer-service/values-staging.yaml \
            --set-string image.digest="$APP_DIGEST" \
            --set-string web.image.digest="$WEB_DIGEST" \
            --take-ownership \
            --atomic \
            --wait \
            --timeout 15m
      - name: Verify staging rollout
        run: |
          kubectl rollout status deployment/aws-csa-customer-service-app --namespace customer-service-staging --timeout=10m
          kubectl rollout status deployment/aws-csa-customer-service-web --namespace customer-service-staging --timeout=10m
          kubectl get pods --namespace customer-service-staging
      - name: Verify public staging endpoints
        run: |
          curl --fail --show-error --silent --retry 6 --retry-delay 10 --retry-all-errors \
            --output /dev/null https://staging.css.ristoh.co.ke/
          curl --fail --show-error --silent --retry 6 --retry-delay 10 --retry-all-errors \
            https://staging.css.ristoh.co.ke/api/healthz
