apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "customer-support.fullname" . }}-app
  labels:
    {{- include "customer-support.labels" . | nindent 4 }}
{{- if eq .Values.telegram.credentialProvider "kubernetes" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "customer-support.fullname" . }}-secret-reader
  labels:
    {{- include "customer-support.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "customer-support.fullname" . }}-secret-reader
  labels:
    {{- include "customer-support.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "customer-support.fullname" . }}-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "customer-support.fullname" . }}-secret-reader
{{- end }}
