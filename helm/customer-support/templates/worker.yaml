{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "customer-support.fullname" . }}-worker
  labels:
    {{- include "customer-support.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              until pg_isready
              --host={{ include "customer-support.fullname" . }}-postgres
              --port={{ .Values.postgres.port }}
              --username={{ .Values.postgres.username }}
              --dbname={{ .Values.postgres.database }};
              do echo "Waiting for PostgreSQL"; sleep 2; done
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.worker"]
          env:
            - name: SUPPORT_DEFAULT_TENANT_ID
              value: {{ .Values.tenant.defaultId | quote }}
            - name: SUPPORT_RETRIEVAL_PROVIDER
              value: {{ .Values.retrieval.provider | quote }}
            - name: SUPPORT_VECTOR_COLLECTION
              value: {{ .Values.vector.collection | quote }}
            - name: SUPPORT_ANSWER_PROVIDER
              value: {{ .Values.answer.provider | quote }}
            - name: SUPPORT_EMBEDDING_PROVIDER
              value: {{ .Values.embedding.provider | quote }}
            - name: SUPPORT_EMBEDDING_MODEL
              value: {{ .Values.embedding.model | quote }}
            - name: SUPPORT_EMBEDDING_DIMENSIONS
              value: {{ .Values.embedding.dimensions | quote }}
            - name: SUPPORT_QUESTION_PLANNER_PROVIDER
              value: {{ .Values.questionPlanner.provider | quote }}
            - name: SUPPORT_HUMAN_REQUEST_DETECTOR_PROVIDER
              value: {{ .Values.humanRequestDetector.provider | quote }}
            - name: SUPPORT_CONVERSATION_HISTORY_MAX_MESSAGES
              value: {{ .Values.conversationHistory.maxMessages | quote }}
            - name: SUPPORT_GREETING_LAPSE_MINUTES
              value: {{ .Values.conversationHistory.greetingLapseMinutes | quote }}
            - name: SUPPORT_TENANT_CONFIG_CACHE_PROVIDER
              value: {{ .Values.tenantConfigCache.provider | quote }}
            - name: SUPPORT_TENANT_CONFIG_CACHE_TTL_SECONDS
              value: {{ .Values.tenantConfigCache.ttlSeconds | quote }}
            {{- if .Values.redis.enabled }}
            - name: SUPPORT_REDIS_URL
              value: {{ printf "redis://%s-redis:%v/0" (include "customer-support.fullname" .) .Values.redis.port | quote }}
            {{- else if .Values.redis.url }}
            - name: SUPPORT_REDIS_URL
              value: {{ .Values.redis.url | quote }}
            {{- end }}
            - name: SUPPORT_LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: SUPPORT_LLM_TEMPERATURE
              value: {{ .Values.llm.temperature | quote }}
            {{- if .Values.llm.existingSecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.existingSecret | quote }}
                  key: {{ .Values.llm.secretKey | quote }}
            {{- end }}
            - name: SUPPORT_LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            - name: SUPPORT_LOG_FORMAT
              value: {{ .Values.logging.format | quote }}
            - name: LANGSMITH_TRACING
              value: {{ .Values.langsmith.LANGSMITH_TRACING | quote }}
            - name: LANGSMITH_TRACING_V2
              value: {{ .Values.langsmith.LANGSMITH_TRACING_V2 | quote }}
            - name: LANGCHAIN_TRACING_V2
              value: {{ .Values.langsmith.LANGCHAIN_TRACING_V2 | quote }}
            - name: LANGSMITH_ENDPOINT
              value: {{ .Values.langsmith.LANGSMITH_ENDPOINT | quote }}
            - name: LANGSMITH_PROJECT
              value: {{ .Values.langsmith.LANGSMITH_PROJECT | quote }}
            {{- if .Values.langsmith.LANGSMITH_WORKSPACE_ID }}
            - name: LANGSMITH_WORKSPACE_ID
              value: {{ .Values.langsmith.LANGSMITH_WORKSPACE_ID | quote }}
            {{- end }}
            {{- if .Values.langsmith.existingSecret }}
            - name: LANGSMITH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.langsmith.existingSecret | quote }}
                  key: {{ .Values.langsmith.secretKey | quote }}
            {{- end }}
            - name: SUPPORT_SEED_KNOWLEDGE
              value: "false"
            - name: SUPPORT_KNOWLEDGE_CHUNK_SIZE
              value: {{ .Values.knowledge.chunkSize | quote }}
            - name: SUPPORT_KNOWLEDGE_CHUNK_OVERLAP
              value: {{ .Values.knowledge.chunkOverlap | quote }}
            - name: SUPPORT_KNOWLEDGE_OBJECT_STORE_PROVIDER
              value: {{ .Values.knowledge.objectStore.provider | quote }}
            - name: SUPPORT_KNOWLEDGE_OBJECT_STORE_BUCKET
              value: {{ .Values.knowledge.objectStore.bucket | quote }}
            - name: SUPPORT_S3_ENDPOINT_URL
              value: {{ default (printf "http://%s-minio:%v" (include "customer-support.fullname" .) .Values.minio.port) .Values.knowledge.objectStore.endpointUrl | quote }}
            - name: SUPPORT_S3_REGION_NAME
              value: {{ .Values.knowledge.objectStore.regionName | quote }}
            - name: SUPPORT_S3_SECURE
              value: {{ .Values.knowledge.objectStore.secure | quote }}
            {{- if .Values.minio.enabled }}
            - name: SUPPORT_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "customer-support.fullname" . }}-minio
                  key: access-key-id
            - name: SUPPORT_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "customer-support.fullname" . }}-minio
                  key: secret-access-key
            {{- end }}
            - name: SUPPORT_KNOWLEDGE_INGESTION_QUEUE_PROVIDER
              value: {{ .Values.knowledge.ingestionQueue.provider | quote }}
            - name: SUPPORT_KNOWLEDGE_INGESTION_QUEUE_NAME
              value: {{ .Values.knowledge.ingestionQueue.name | quote }}
            - name: SUPPORT_KNOWLEDGE_INGESTION_WORKER_POLL_SECONDS
              value: {{ .Values.knowledge.ingestionQueue.workerPollSeconds | quote }}
            - name: SUPPORT_KNOWLEDGE_PDF_OCR_PROVIDER
              value: {{ .Values.knowledge.pdfOcr.provider | quote }}
            - name: SUPPORT_KNOWLEDGE_PDF_OCR_MODEL
              value: {{ .Values.knowledge.pdfOcr.model | quote }}
            - name: SUPPORT_KNOWLEDGE_PDF_OCR_DPI
              value: {{ .Values.knowledge.pdfOcr.dpi | quote }}
            - name: SUPPORT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "customer-support.fullname" . }}-postgres
                  key: database-url
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
