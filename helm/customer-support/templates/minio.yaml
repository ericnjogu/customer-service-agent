{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "customer-support.fullname" . }}-minio
  labels:
    {{- include "customer-support.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key-id: {{ .Values.minio.rootUser | quote }}
  secret-access-key: {{ .Values.minio.rootPassword | quote }}
  {{- if .Values.minio.license.value }}
  {{ .Values.minio.license.secretKey }}: {{ .Values.minio.license.value | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "customer-support.fullname" . }}-minio
  labels:
    {{- include "customer-support.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: api
      port: {{ .Values.minio.port }}
      targetPort: api
    - name: console
      port: {{ .Values.minio.consolePort }}
      targetPort: console
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "customer-support.fullname" . }}-minio
  labels:
    {{- include "customer-support.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "customer-support.fullname" . }}-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: minio
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: minio
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image | quote }}
          args:
            - server
            - /data
            - --console-address
            - ":{{ .Values.minio.consolePort }}"
            {{- if or .Values.minio.license.value .Values.minio.license.existingSecret }}
            - --license
            - /license/{{ .Values.minio.license.secretKey }}
            {{- end }}
          ports:
            - name: api
              containerPort: {{ .Values.minio.port }}
            - name: console
              containerPort: {{ .Values.minio.consolePort }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "customer-support.fullname" . }}-minio
                  key: access-key-id
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "customer-support.fullname" . }}-minio
                  key: secret-access-key
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if or .Values.minio.license.value .Values.minio.license.existingSecret }}
            - name: license
              mountPath: /license
              readOnly: true
            {{- end }}
      {{- if or .Values.minio.license.value .Values.minio.license.existingSecret }}
      volumes:
        - name: license
          secret:
            secretName: {{ default (printf "%s-minio" (include "customer-support.fullname" .)) .Values.minio.license.existingSecret }}
            items:
              - key: {{ .Values.minio.license.secretKey }}
                path: {{ .Values.minio.license.secretKey }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.minio.storage }}
{{- end }}
