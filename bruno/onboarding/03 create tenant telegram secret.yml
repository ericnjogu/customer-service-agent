info:
  name: 03 create tenant Telegram Secret
  type: http
  seq: 3

http:
  method: patch
  url: "{{k8s_proxy_url}}/api/v1/namespaces/{{k8s_namespace}}/secrets/{{tenant_telegram_secret_name}}?fieldManager=bruno-onboarding&force=true"
  headers:
    - name: content-type
      value: application/apply-patch+yaml
  body:
    type: text
    data: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{tenant_telegram_secret_name}}
        namespace: {{k8s_namespace}}
        labels:
          app.kubernetes.io/managed-by: bruno-onboarding
          customer-service/tenant-id: {{tenant_id}}
          customer-service/tenant-slug: {{tenant_slug}}
      type: Opaque
      stringData:
        TELEGRAM_BOT_TOKEN: "{{telegram_bot_token}}"
        TELEGRAM_WEBHOOK_SECRET_TOKEN: "{{telegram_webhook_secret_token}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("tenant_telegram_secret_name", `tenant-${bru.getVar("tenant_slug")}-telegram`);
    - type: after-response
      code: |-
        if (res.status >= 200 && res.status < 300) {
          bru.setVar("tenant_telegram_secret_name", res.body.metadata.name);
        }

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates or updates the tenant-specific Kubernetes Secret used by the app's
  `telegram_secret_name` tenant config field. This request assumes `kubectl proxy`
  is running locally, for example:

  `kubectl proxy --port=8001 --address=127.0.0.1`

  Required Bruno environment variables:
  - `k8s_proxy_url`, e.g. `http://127.0.0.1:8001`
  - `k8s_namespace`, e.g. `customer-service`
  - `telegram_bot_token`
  - `telegram_webhook_secret_token`
