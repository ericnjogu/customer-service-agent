name: Build production images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: production-images
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/${{ github.repository }}
  WEB_IMAGE: ghcr.io/${{ github.repository }}-web
  BACKUP_IMAGE: ghcr.io/${{ github.repository }}-postgres-backup

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push application
        id: app
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ github.sha }}
      - name: Build and push web
        id: web
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: web
          file: web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ github.sha }}
      - name: Build and push PostgreSQL backup utility
        id: backup
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: ops/postgres-backup
          file: ops/postgres-backup/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.BACKUP_IMAGE }}:${{ github.sha }}
      - name: Rebuild immutable production delivery branch
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          BACKUP_DIGEST: ${{ steps.backup.outputs.digest }}
        run: |
          case "$APP_DIGEST" in sha256:*) ;; *) exit 1 ;; esac
          case "$WEB_DIGEST" in sha256:*) ;; *) exit 1 ;; esac
          case "$BACKUP_DIGEST" in sha256:*) ;; *) exit 1 ;; esac
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch --orphan deploy/production-next
          git rm -rf .
          git checkout "$GITHUB_SHA" -- app/prompt_templates helm gitops
          mkdir -p helm/customer-service/files/prompts
          cp app/prompt_templates/*.md helm/customer-service/files/prompts/
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path("helm/customer-service/values-production.yaml")
          value = path.read_text()
          zeros = "sha256:" + "0" * 64
          value = value.replace(zeros, os.environ["APP_DIGEST"], 1)
          value = value.replace(zeros, os.environ["WEB_DIGEST"], 1)
          path.write_text(value)

          path = Path("helm/production-platform/values.yaml")
          value = path.read_text().replace(zeros, os.environ["BACKUP_DIGEST"], 1)
          path.write_text(value)
          PY
          git add app helm gitops
          git commit -m "Deploy production $GITHUB_SHA"
          git push origin HEAD:deploy/production --force
