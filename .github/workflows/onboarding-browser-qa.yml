name: Onboarding browser QA

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: customer_service_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d customer_service_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      wiremock:
        image: wiremock/wiremock:3.13.2
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6
        with: { enable-cache: true }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: uv sync --locked
      - run: npm ci
        working-directory: web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Wait for WireMock
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/__admin/mappings >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Run human-style onboarding scenarios
        env:
          AGENT_WIREMOCK_URL: http://127.0.0.1:8080
          AGENT_E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/customer_service_e2e
          AGENT_E2E_REDIS_URL: redis://127.0.0.1:6379/0
        run: npm run test:e2e:services
        working-directory: web
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onboarding-browser-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7
