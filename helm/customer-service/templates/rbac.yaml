apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "customer-service.fullname" . }}-app
  labels:
    {{- include "customer-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if eq .Values.telegram.credentialProvider "kubernetes" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "customer-service.fullname" . }}-secret-reader
  labels:
    {{- include "customer-service.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs:
      - get
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "customer-service.fullname" . }}-secret-reader
  labels:
    {{- include "customer-service.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "customer-service.fullname" . }}-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "customer-service.fullname" . }}-secret-reader
{{- end }}
