info:
  name: user chat
  type: http
  seq: 2

http:
  method: post
  url: http://{{host}}/messages/customer
  headers:
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "event_id": "{{event_id}}",
        "external_chat_id": "chat-1",
        "external_user_id": "user-1",
        "text": "do you serve chocolate?"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const { v4: uuidv4 } = require('uuid');
        bru.setEnvVar('event_id', uuidv4());

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
