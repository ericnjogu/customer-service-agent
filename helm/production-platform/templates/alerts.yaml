apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: production-recovery-readiness
  namespace: monitoring
spec:
  groups:
    - name: production-backups
      rules:
        - alert: ProductionPostgresBackupFailed
          expr: barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{namespace="{{ .Values.namespace }}"} > barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="{{ .Values.namespace }}"}
          for: 5m
          labels: { severity: critical }
          annotations: { summary: "A production PostgreSQL backup job failed" }
        - alert: ProductionPostgresBaseBackupStale
          expr: time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="{{ .Values.namespace }}"} > 93600
          for: 15m
          labels: { severity: critical }
          annotations: { summary: "No successful PostgreSQL base backup in 26 hours" }
        - alert: ProductionBackupMetricsMissing
          expr: absent(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{namespace="{{ .Values.namespace }}"}) == 1
          for: 15m
          labels: { severity: critical }
          annotations: { summary: "Production backup monitoring is unavailable" }
    - name: production-capacity
      rules:
        - alert: ProductionNodeDiskLow
          expr: 100 * node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"} < 20
          for: 15m
          labels: { severity: warning }
          annotations: { summary: "Production node root filesystem has less than 20% free" }
        - alert: ProductionCertificateExpiresSoon
          expr: certmanager_certificate_expiration_timestamp_seconds{namespace="{{ .Values.namespace }}"} - time() < 1209600
          for: 15m
          labels: { severity: warning }
          annotations: { summary: "Production certificate expires in less than 14 days" }
        - alert: ProductionPersistentVolumeNearlyFull
          expr: 100 * kubelet_volume_stats_available_bytes{namespace="{{ .Values.namespace }}"} / kubelet_volume_stats_capacity_bytes{namespace="{{ .Values.namespace }}"} < 20
          for: 15m
          labels: { severity: warning }
          annotations: { summary: "A production persistent volume has less than 20% free capacity" }
