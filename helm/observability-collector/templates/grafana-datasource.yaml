{{- if .Values.exporters.otlp.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-grafana-datasource
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki-gateway.{{ .Release.Namespace }}.svc
        isDefault: false
        editable: false
{{- end }}
{{- if .Values.exporters.traces.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-grafana-datasource
  labels:
    grafana_datasource: "1"
data:
  tempo.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: {{ required "exporters.traces.grafanaUrl is required" .Values.exporters.traces.grafanaUrl | quote }}
        isDefault: false
        editable: false
{{- end }}
