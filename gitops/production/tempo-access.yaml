# Tempo has no built-in authentication; keep ingestion and queries private.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-private-access
  namespace: monitoring
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: tempo, app.kubernetes.io/instance: tempo }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: otel-collector }
      ports: [{ protocol: TCP, port: 4318 }]
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: grafana }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: vmagent }
      ports: [{ protocol: TCP, port: 3200 }]
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: tempo
  namespace: monitoring
spec:
  selector:
    matchLabels: { ristoh.co.ke/scrape: tempo }
    matchExpressions:
      - key: prometheus.io/service-monitor
        operator: NotIn
        values: ["false"]
  endpoints:
    - port: prom-metrics
      path: /metrics
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: tempo-health
  namespace: monitoring
spec:
  groups:
    - name: tempo-health
      rules:
        - alert: TempoUnavailable
          expr: kube_statefulset_status_replicas_ready{namespace="monitoring",statefulset="tempo"} < 1 or absent(kube_statefulset_status_replicas_ready{namespace="monitoring",statefulset="tempo"})
          for: 5m
          labels: { severity: warning }
          annotations: { summary: "Trace storage is unavailable; inspect Tempo and its PVC" }
        - alert: TempoStorageNearlyFull
          expr: kubelet_volume_stats_available_bytes{namespace="monitoring",persistentvolumeclaim="storage-tempo-0"} / kubelet_volume_stats_capacity_bytes{namespace="monitoring",persistentvolumeclaim="storage-tempo-0"} < 0.15
          for: 15m
          labels: { severity: warning }
          annotations: { summary: "Tempo trace storage has less than 15% free space" }
