[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "customer-service-agent"
version = "0.1.0"
description = "Incremental LangGraph customer service agent"
requires-python = ">=3.10"
dependencies = [
  "asyncpg>=0.29,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain-core>=0.3,<1",
  "langchain-openai>=0.2,<1",
  "langchain-text-splitters>=0.3,<1",
  "langgraph>=0.2,<1",
  "litellm>=1.93,<1.94",
  "phonenumbers>=9.0,<10",
  "pydantic-settings>=2.6,<3",
  "redis>=5,<6",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
