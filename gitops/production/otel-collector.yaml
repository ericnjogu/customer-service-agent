apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://github.com/ericnjogu/customer-service-agent.git
    targetRevision: deploy/production
    path: helm/observability-collector
    helm:
      valueFiles: [values-production.yaml]
  destination: { server: https://kubernetes.default.svc, namespace: monitoring }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
