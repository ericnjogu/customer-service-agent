image:
  repository: customer-support
  tag: local
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8000

postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  database: support
  username: support
  password: local-only-password
  storage: 1Gi

retrieval:
  provider: pgvector

answer:
  provider: openai

embedding:
  provider: openai
  model: text-embedding-3-small
  dimensions: 1536

humanRequestDetector:
  provider: llm

conversationHistory:
  maxMessages: 50
  greetingLapseMinutes: 60

telegram:
  existingSecret: "telegram-bot"
  botTokenSecretKey: TELEGRAM_BOT_TOKEN
  webhookSecretTokenSecretKey: TELEGRAM_WEBHOOK_SECRET_TOKEN

llm:
  model: gpt-4.1-mini
  temperature: "0"
  existingSecret: "api-keys"
  secretKey: OPENAI_API_KEY

knowledge:
  existingConfigMap: "seed-knowledge"
  mountPath: /knowledge
  seedOnStartup: true
  chunkSize: 1200
  chunkOverlap: 200

logging:
  level: INFO
  format: "{asctime} - {levelname}: {name}: {message}"

langsmith:
  LANGSMITH_TRACING: "true"
  LANGSMITH_TRACING_V2: "true"
  LANGSMITH_ENDPOINT: "https://eu.api.smith.langchain.com"
  LANGSMITH_PROJECT: "customer-support"
  existingSecret: "api-keys"
  secretKey: LANGSMITH_API_KEY

resources: {}
