apiVersion: v1
kind: Namespace
metadata:
  name: aws-observability
  labels:
    aws-observability: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: customer-service-staging
  labels:
    app.kubernetes.io/part-of: aws-csa
    environment: staging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-logging
  namespace: aws-observability
data:
  output.conf: |
    [OUTPUT]
        Name cloudwatch_logs
        Match   *
        region {{ .Values.region }}
        log_group_name {{ .Values.fargateLogGroup }}
        log_stream_prefix fargate-
        auto_create_group false
  filters.conf: |
    [FILTER]
        Name parser
        Match *
        Key_name log
        Parser containerd
        Preserve_Key True
        Reserve_Data True
  parsers.conf: |
    [PARSER]
        Name containerd
        Format regex
        Regex ^(?<time>.+) (?<stream>stdout|stderr) (?<logtag>[FP]) (?<log>.*)$
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-csa-operator
  namespace: argocd
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["aws-csa-staging"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-csa-operator
  namespace: argocd
subjects:
  - kind: Group
    name: ristoh-ai-chatbot-operator
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aws-csa-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aws-csa-operator
  namespace: customer-service-staging
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aws-csa-operator
  namespace: customer-service-staging
subjects:
  - kind: Group
    name: ristoh-ai-chatbot-operator
    apiGroup: rbac.authorization.k8s.io
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aws-csa-operator
---
apiVersion: vpcresources.k8s.aws/v1beta1
kind: SecurityGroupPolicy
metadata:
  name: aws-csa-data-access
  namespace: customer-service-staging
spec:
  podSelector:
    matchLabels:
      aws-csa/data-access: "true"
  securityGroups:
    groupIds:
      - {{ required "workloadSecurityGroupId is required" .Values.workloadSecurityGroupId }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: customer-service-staging
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-keys
  namespace: customer-service-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: api-keys
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: ristoh-ai-chatbot/staging/api-keys
        property: OPENAI_API_KEY
    - secretKey: LANGSMITH_API_KEY
      remoteRef:
        key: ristoh-ai-chatbot/staging/api-keys
        property: LANGSMITH_API_KEY
    - secretKey: LANGSMITH_WORKSPACE_ID
      remoteRef:
        key: ristoh-ai-chatbot/staging/api-keys
        property: LANGSMITH_WORKSPACE_ID
    - secretKey: RESEND_API_KEY
      remoteRef:
        key: ristoh-ai-chatbot/staging/api-keys
        property: RESEND_API_KEY
    - secretKey: PLATFORM_TAVILY_API_KEY
      remoteRef:
        key: ristoh-ai-chatbot/staging/api-keys
        property: PLATFORM_TAVILY_API_KEY
    - secretKey: OPENAI_ADMIN_KEY
      remoteRef:
        key: ristoh-ai-chatbot/staging/api-keys
        property: OPENAI_ADMIN_KEY
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-csa-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repository }}
    targetRevision: {{ .Values.revision }}
    path: helm/customer-service
    helm:
      releaseName: aws-csa
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: customer-service-staging
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
