image:
  repository: ghcr.io/ericnjogu/customer-service-agent
  tag: bootstrap-required
  digest: "sha256:da493518f6316ff6ac1bf99039a9d51454e74dcd4157973666733a87a556435a"
  pullPolicy: IfNotPresent

replicaCount: 2

imagePullSecrets:
  - name: ghcr-pull

web:
  replicaCount: 2
  image:
    repository: ghcr.io/ericnjogu/customer-service-agent-web
    tag: bootstrap-required
    digest: "sha256:8957d05b814e9f9be86bcfbbec559908b1c46b2f8514a98fb8f1843daf1742a8"
    pullPolicy: IfNotPresent
  publicBaseUrl: https://css.ristoh.co.ke
  apiBaseUrl: /api
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }

ingress:
  enabled: true
  className: traefik
  host: css.ristoh.co.ke
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
  tls:
    - hosts: [css.ristoh.co.ke]
      secretName: css-ristoh-co-ke-tls

postgres:
  enabled: false

database:
  existingSecret: production-postgres-app
  secretKey: uri

redis:
  enabled: false
  url: redis://production-redis:6379/0
  iamAuth:
    enabled: false

telegram:
  credentialProvider: kubernetes
  secretNamespace: customer-service-production

whatsapp:
  secretNamespace: customer-service-production

onboarding:
  verificationCodeSecretName: app-configs
  # Enable only after a real Meta acceptance session and operational gates pass.
  whatsappEnabled: true

openbao:
  enabled: true

email:
  configSecretName: app-configs

llm:
  existingSecret: api-keys

langsmith:
  existingSecret: api-keys
  LANGSMITH_PROJECT: customer-service-production

prompts:
  enabled: true
  useBundledFiles: true

logging:
  level: INFO

telemetry:
  enabled: false
  endpoint: http://otel-collector.monitoring.svc:4318
  serviceName: customer-service-agent
  environment: production
  traceSampleRatio: "0.1"

resources:
  requests: { cpu: 150m, memory: 384Mi }
  limits: { cpu: "1", memory: 1Gi }
